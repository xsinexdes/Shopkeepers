# This name is also shown in the status badge.
name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Compila TU propio código modificado, no el original de internet
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle
    - name: Build Shopkeepers
      env:
        _JAVA_OPTIONS: "-Xmx4G"
        GRADLE_OPTS: "-Xmx4G"
      run: |
        chmod +x gradlew
        ./gradlew clean build
    # Organiza el archivo JAR definitivo y unificado
    - name: Stage artifacts for upload
      run: |
        mkdir staging
        cp modules/dist/build/libs/Shopkeepers-*.jar staging/ 2>/dev/null || cp modules/main/build/libs/Shopkeepers-*.jar staging/ || true
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shopkeepers-artifacts
        path: staging/
